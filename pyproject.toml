[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "takgram"
version = "0.1.0"
description = "TAK to Telegram bridge: readable CoT cards in Telegram, no ATAK plugin, works without a TAK Server"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9", "defusedxml>=0.7", "mgrs>=1.4", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
takgram = "takgram.__main__:main"

[tool.setuptools.packages.find]
include = ["takgram*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
